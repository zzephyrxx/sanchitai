<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      window.__bootErrs = [];
      window.addEventListener('error', function (e) { window.__bootErrs.push('error: ' + (e.message || '') + ' @ ' + (e.filename || '').slice(-60) + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { window.__bootErrs.push('rejection: ' + String((e.reason && e.reason.stack) || e.reason).slice(0, 400)); });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
