<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三尺台 · 字标候选预览</title>
<style>
  body { margin:0; font-family: 'PingFang SC', sans-serif; background:#F5F3EF; color:#1C1C1E; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 32px; }
  h1 { font-weight: 900; letter-spacing: 2px; }
  .card { background:#fff; border-radius:16px; padding:32px; margin:24px 0; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 8px; font-size:18px; }
  .card p { margin:0 0 20px; color:#666; font-size:13px; }
  .row { display:flex; gap:32px; align-items:center; flex-wrap:wrap; }
  .tile { background:#F5F3EF; border-radius:12px; padding:20px; }
  .dark { background:#232326; }
  .dark .label { color:#aaa; }
  .label { font-size:12px; color:#999; margin-top:8px; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup img { width:44px; height:44px; }
  .lockup span { font-family:'Songti SC',serif; font-weight:900; font-size:26px; letter-spacing:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>三尺台 · 字标候选（三选一）</h1>
  <p style="color:#666">关键色 党建红 #A81C24 · 中式简约 · 用作侧边栏 Logo / 应用图标 / 浏览器 Favicon</p>

  <div class="card">
    <h2>候选 A · 朱红方印「三尺台」白文</h2>
    <p>印章气质最浓，小尺寸辨识度高；适合应用图标与 Favicon。</p>
    <div class="row">
      <div class="tile"><img src="candidate-a-seal.svg" width="180"><div class="label">浅色底</div></div>
      <div class="tile dark"><img src="candidate-a-seal.svg" width="180"><div class="label">深色底</div></div>
    </div>
  </div>

  <div class="card">
    <h2>候选 B · 「三尺」标尺抽象形</h2>
    <p>三根递升立柱喻"三尺"与进阶，量尺刻度呼应工作台属性；最抽象、最现代。</p>
    <div class="row">
      <div class="tile"><img src="candidate-b-ruler.svg" width="180"><div class="label">浅色底</div></div>
      <div class="tile dark"><img src="candidate-b-ruler.svg" width="180"><div class="label">深色底</div></div>
    </div>
  </div>

  <div class="card">
    <h2>候选 C · 横排字标 + 「学工」小章</h2>
    <p>完整字标横排，右落朱红小章；适合页眉/文档落款等横长空间。</p>
    <div class="row">
      <div class="tile"><img src="candidate-c-wordmark.svg" width="520"><div class="label">浅色底</div></div>
    </div>
    <p style="margin-top:20px">侧边栏实际效果示意：</p>
    <div class="row">
      <div class="tile lockup"><img src="candidate-a-seal.svg"><span>三尺台</span></div>
      <div class="tile dark lockup"><img src="candidate-a-seal.svg"><span style="color:#F5F3EF">三尺台</span></div>
    </div>
  </div>
</div>
</body>
</html>
