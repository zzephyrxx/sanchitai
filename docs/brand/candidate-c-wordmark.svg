<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <!-- 候选C：横排宋体字标 + 朱红小章「学工」 -->
  <text x="40" y="176" font-family="'Songti SC','STSong','SimSun',serif" font-weight="900"
        font-size="150" fill="#1C1C1E" letter-spacing="14">三尺台</text>
  <!-- 落款小章：白文「学工」 -->
  <g transform="translate(620,88)">
    <rect x="0" y="0" width="128" height="128" rx="18" fill="#A81C24"/>
    <text x="64" y="58" font-family="'Songti SC','STSong','SimSun',serif" font-weight="900"
          font-size="44" fill="#FFFFFF" text-anchor="middle">学</text>
    <text x="64" y="110" font-family="'Songti SC','STSong','SimSun',serif" font-weight="900"
          font-size="44" fill="#FFFFFF" text-anchor="middle">工</text>
  </g>
  <!-- 顿点刻度装饰 -->
  <g stroke="#A81C24" stroke-width="8" stroke-linecap="round">
    <line x1="44" y1="216" x2="220" y2="216"/>
  </g>
</svg>
