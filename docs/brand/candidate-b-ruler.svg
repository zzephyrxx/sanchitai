<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 候选B：「三尺」标尺抽象形——三根递升立柱 + 量尺刻度 -->
  <g>
    <!-- 三根立柱：渐次升高，喻三尺与进阶 -->
    <rect x="96"  y="308" width="76" height="148" rx="10" fill="#A81C24"/>
    <rect x="218" y="228" width="76" height="228" rx="10" fill="#A81C24" fill-opacity="0.82"/>
    <rect x="340" y="120" width="76" height="336" rx="10" fill="#1C1C1E"/>
    <!-- 立柱上的量尺刻度（镂空线） -->
    <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round">
      <line x1="110" y1="352" x2="158" y2="352"/>
      <line x1="110" y1="396" x2="138" y2="396"/>
      <line x1="232" y1="272" x2="280" y2="272"/>
      <line x1="232" y1="316" x2="260" y2="316"/>
      <line x1="232" y1="360" x2="280" y2="360"/>
      <line x1="354" y1="164" x2="402" y2="164"/>
      <line x1="354" y1="208" x2="382" y2="208"/>
      <line x1="354" y1="252" x2="402" y2="252"/>
    </g>
    <!-- 基线：案头/讲台之台 -->
    <rect x="72" y="456" width="368" height="14" rx="7" fill="#1C1C1E"/>
  </g>
</svg>
