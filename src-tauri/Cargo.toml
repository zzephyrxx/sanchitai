[package]
name = "sanchitai"
version = "0.3.0"
description = "三尺台 · 学工个人离线工作台"
edition = "2021"

[lib]
name = "sanchitai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
